<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoList</title>
    <link
      href="https://fonts.googleapis.com/css?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css"
      integrity="sha256-mmgLkCYLUQbXn0B1SRqzHar6dCnv9oZFPEC1g1cwlkk="
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Ed's Todo List</h1>
    </header>
    <form novalidate>
      <label class="visually-hidden" for="todo-input">New todo</label>
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="Add a new todo..."
        autocomplete="off"
      />
      <button class="todo-button" type="submit" aria-label="Add todo">
        <i class="fas fa-plus-square"></i>
      </button>
      <div class="select">
        <label class="visually-hidden" for="filter-todo">Filter todos</label>
        <select name="todos" id="filter-todo" class="filter-todo">
          <option value="all">All</option>
          <option value="completed">Completed</option>
          <option value="uncompleted">Uncompleted</option>
        </select>
      </div>
    </form>
    <div class="todo-container">
      <ul class="todo-list"></ul>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
